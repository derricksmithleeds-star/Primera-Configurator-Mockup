
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your HPE Primera 600 Configuration</title>
    <link rel="stylesheet" type="text/css" media="all"
          href="https://www.renewtech.co.uk/static/version1784041663/frontend/Renewtech/default/en_US/css/styles.css">
    <style>
        body { background: #fff; }
        .mock-header { border-bottom: 1px solid #e5e7eb; }
        .mock-wrap { max-width: 1280px; margin: 0 auto; padding: 28px 20px 60px; }
        .mock-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 32px; }
        .config-card, .summary-card { border: 1px solid #d1d5db; background: #fff; }
        .config-heading, .summary-heading { padding: 18px 20px; border-bottom: 1px solid #d1d5db; font-weight: 600; }
        .config-row { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; display: grid;
                      grid-template-columns: minmax(0, 1fr) auto; gap: 20px; }
        .config-row:last-child { border-bottom: 0; }
        .category { font-weight: 600; margin-bottom: 5px; }
        .option-name { font-size: 14px; line-height: 1.45; }
        .qty { font-size: 13px; margin-top: 5px; color: #4b5563; }
        .price { text-align: right; white-space: nowrap; font-size: 14px; }
        .summary-body { padding: 20px; }
        .summary-line { display: flex; justify-content: space-between; gap: 20px; padding: 8px 0; }
        .summary-total { display: flex; justify-content: space-between; gap: 20px; padding-top: 18px;
                         margin-top: 10px; border-top: 1px solid #d1d5db; font-weight: 700; font-size: 20px; }
        .empty { padding: 24px 20px; }
        .actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }

        .quote-cta {
            margin-top: 22px;
            background: #c7e7eb;
            padding: 44px 20px;
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
            gap: 32px;
            align-items: center;
        }
        .quote-cta-copy {
            font-size: 22px;
            line-height: 1.25;
            max-width: 690px;
        }
        .quote-cta-button {
            justify-self: start;
            min-width: 330px;
            text-align: center;
            font-size: 20px;
            padding: 15px 24px;
            border-radius: 8px;
        }
        .quote-cta-button:hover {
            opacity: 0.8;
        }
        @media (max-width: 850px) {
            .mock-grid { grid-template-columns: 1fr; }
            .quote-cta { grid-template-columns: 1fr; padding: 30px 22px; }
            .quote-cta-button { justify-self: stretch; min-width: 0; }
        }

    
        .quote-cta .quote-cta-button,
        .quote-cta .quote-cta-button:hover,
        .quote-cta .quote-cta-button:focus,
        .quote-cta .quote-cta-button:active {
            transform: none !important;
            translate: none !important;
            position: static !important;
            top: auto !important;
            right: auto !important;
            bottom: auto !important;
            left: auto !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            padding: 15px 24px !important;
            line-height: normal !important;
        }
        .quote-cta .quote-cta-button:hover {
            opacity: 0.8 !important;
        }
        .quote-cta .quote-cta-button::before,
        .quote-cta .quote-cta-button::after,
        .quote-cta .quote-cta-button:hover::before,
        .quote-cta .quote-cta-button:hover::after {
            transform: none !important;
        }

    </style>
</head>
<body>
    <header class="mock-header">
        <div class="mock-wrap" style="padding-top:18px;padding-bottom:18px;">
            <a href="index.html" aria-label="Back to configurator">
                <img src="https://www.renewtech.co.uk/media/converted/logo/stores/26/logo_web.webp"
                     alt="Renewtech" style="height:38px;width:auto;">
            </a>
        </div>
    </header>

    <main class="mock-wrap">
        <h1 class="text-3xl font-semibold mb-7">Your Configuration</h1>

        <div class="mock-grid">
            <section class="config-card">
                <div class="config-heading">HPE Primera 600</div>
                <div id="configuration-items"></div>
            </section>

            <aside>
                <div class="summary-card">
                    <div class="summary-heading">Order Summary</div>
                    <div class="summary-body">
                        <div class="summary-line">
                            <span>Configuration subtotal</span>
                            <span id="subtotal">£0.00</span>
                        </div>
                        <div class="summary-total">
                            <span>Total</span>
                            <span id="total">£0.00</span>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <a class="btn btn-secondary" href="index.html">Edit Configuration</a>
                </div>
            </aside>
        </div>

        <section class="quote-cta" aria-label="Request a final quote">
            <div class="quote-cta-copy">
                Submit this configuration to receive an up-to-date quote from our sales team, who will review it, confirm pricing, and source the components from stock.
            </div>
            <button type="button" class="btn btn-primary quote-cta-button">Confirm &amp; Request Quote</button>
        </section>
    </main>

<script>
(function () {
    function money(value) {
        return new Intl.NumberFormat('en-GB', {
            style: 'currency',
            currency: 'GBP',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(Number(value) || 0);
    }

    var target = document.getElementById('configuration-items');
    var subtotal = document.getElementById('subtotal');
    var total = document.getElementById('total');

    var data = null;
    try {
        var stored = localStorage.getItem('primeraConfiguration');
        data = stored ? JSON.parse(stored) : null;
    } catch (error) {
        console.error('Could not read saved Primera configuration', error);
    }

    if (!data || !Array.isArray(data.items) || !data.items.length) {
        target.innerHTML =
            '<div class="empty">No configuration has been saved yet. ' +
            '<a href="index.html" style="text-decoration:underline;">Return to the configurator</a>.</div>';
        subtotal.textContent = '£0.00';
        total.textContent = '£0.00';
        return;
    }

    target.innerHTML = '';

    data.items.forEach(function (item) {
        var row = document.createElement('div');
        row.className = 'config-row';

        var details = document.createElement('div');

        var category = document.createElement('div');
        category.className = 'category';
        category.textContent = item.category || 'Configuration';

        var name = document.createElement('div');
        name.className = 'option-name';
        name.textContent = item.name || '';

        details.appendChild(category);
        details.appendChild(name);

        var qtyValue = Number(item.qty) || 1;
        if (qtyValue > 1) {
            var qty = document.createElement('div');
            qty.className = 'qty';
            qty.textContent = 'Qty: ' + qtyValue;
            details.appendChild(qty);
        }

        var price = document.createElement('div');
        price.className = 'price';
        price.textContent = money(item.lineTotal);

        row.appendChild(details);
        row.appendChild(price);
        target.appendChild(row);
    });

    var configTotal = Number(data.total) || data.items.reduce(function (sum, item) {
        return sum + (Number(item.lineTotal) || 0);
    }, 0);

    subtotal.textContent = money(configTotal);
    total.textContent = money(configTotal);
})();
</script>
</body>
</html>
